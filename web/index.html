<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MAVIR rendszerterhelés és termelés</title>
  <style>
    :root { color-scheme: light dark; }
    html, body { height: 100%; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      margin: 0; padding: 1rem; box-sizing: border-box;
      background: #0f1115; color: #e6e6e6;
      display: flex; flex-direction: column; overflow: hidden;
    }
    header { display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
    h1 { font-size: 1.15rem; font-weight: 600; margin: 0 0 .25rem; }
    .github-link { color: inherit; display: inline-flex; opacity: .8; }
    .github-link:hover { opacity: 1; }
    .github-link svg { fill: currentColor; height: 1.5rem; width: 1.5rem; }
    .meta { font-size: .8rem; opacity: .7; margin-bottom: .75rem; }
    #wrap { position: relative; flex: 1; min-height: 0; }
    .err { color: #ff6b6b; }
  </style>
</head>
<body>
  <header>
    <h1>MAVIR rendszerterhelés és termelés (15 perces bontás)</h1>
    <a class="github-link" href="https://github.com/noherczeg/mavir-load" aria-label="GitHub tároló">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82A7.65 7.65 0 0 1 8 4.8c.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/></svg>
    </a>
  </header>
  <div class="meta" id="meta">Adatok betöltése…</div>
  <div id="wrap"><canvas id="chart"></canvas></div>
  <div class="err" id="err"></div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/luxon@3.5.0/build/global/luxon.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-luxon@1.3.1/dist/chartjs-adapter-luxon.umd.min.js"></script>
  <script>
  const TZ = "Europe/Budapest";

  // Exact official MAVIR legend labels (from mavir.hu/web/mavir/rendszerterheles).
  const LABELS = {
    gross_actual:  "Bruttó tény rendszerterhelés",
    net_plan_gen:  "Nettó terv rendszertermelés",
    gross_plan:    "Bruttó terv rendszerterhelés",
    // Production (chart 4401) — exact MAVIR column names.
    prod_gross_plan:   "Bruttó terv erőművi termelés",
    prod_gross_actual: "Bruttó tény erőművi termelés",
  };
  const COLORS = {
    gross_actual:  "#5b8ff9", net_plan_gen: "#ff7fbf",
    gross_plan:    "#c98a5e",
    prod_gross_plan: "#f6a821", prod_gross_actual: "#f2545b",
  };
  const KEYS = Object.keys(LABELS);
  // All curated series are drawn on load; still individually toggleable.
  const DEFAULT_ON = new Set(KEYS);
  // Actual columns: where these go null marks the present moment ("Most").
  const ACTUAL_KEYS = ["gross_actual", "prod_gross_actual"];

  // Persist which series are visible (by stable key, not label/index).
  // v2: curated series set changed — old stored visibility is discarded.
  const STORE_KEY = "mavir.series.v2";
  function loadVisibility() {
    try { return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; } catch { return {}; }
  }
  function isOn(stored, k) {
    return k in stored ? !!stored[k] : DEFAULT_ON.has(k);
  }
  function saveVisibility(chart) {
    const state = {};
    KEYS.forEach((k, i) => { state[k] = chart.isDatasetVisible(i); });
    try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch {}
  }

  function budapestToday() {
    const p = new Intl.DateTimeFormat("en-CA", {
      timeZone: TZ, year: "numeric", month: "2-digit", day: "2-digit",
    }).formatToParts(new Date());
    const g = (t) => p.find((x) => x.type === t).value;
    return `${g("year")}-${g("month")}-${g("day")}`;
  }
  function shiftDate(iso, days) {
    const d = new Date(iso + "T12:00:00Z");
    d.setUTCDate(d.getUTCDate() + days);
    return d.toISOString().slice(0, 10);
  }
  async function loadDay(date) {
    try {
      const r = await fetch(`../data/${date}.json`, { cache: "no-store" });
      if (!r.ok) return [];
      return (await r.json()).points || [];
    } catch { return []; }
  }

  // Vertical "Most" line at the present-moment boundary (a Chart.js plugin).
  function nowLinePlugin(getBoundaryX) {
    return {
      id: "nowLine",
      afterDatasetsDraw(chart) {
        const x = getBoundaryX();
        if (x == null) return;
        const px = chart.scales.x.getPixelForValue(x);
        const { ctx, chartArea } = chart;
        if (px < chartArea.left || px > chartArea.right) return;
        ctx.save();
        ctx.strokeStyle = "#ff6b6b"; ctx.lineWidth = 1; ctx.setLineDash([4, 3]);
        ctx.beginPath(); ctx.moveTo(px, chartArea.top); ctx.lineTo(px, chartArea.bottom); ctx.stroke();
        ctx.setLineDash([]); ctx.fillStyle = "#ff6b6b"; ctx.font = "11px system-ui";
        ctx.fillText("Most", px + 4, chartArea.top + 12);
        ctx.restore();
      },
    };
  }

  (async function main() {
    const today = budapestToday();
    // ±12h window straddles day boundaries -> load today plus both neighbours.
    const dates = [shiftDate(today, -1), today, shiftDate(today, 1)];
    const dayArrays = await Promise.all(dates.map(loadDay));
    const now = Date.now();
    const windowStart = now - 12 * 60 * 60 * 1000;
    const windowEnd = now + 12 * 60 * 60 * 1000;
    const points = dayArrays.flat()
      .filter((p) => {
        const time = Date.parse(p.t);
        return time >= windowStart && time <= windowEnd;
      })
      .sort((a, b) => a.t.localeCompare(b.t));

    const errEl = document.getElementById("err");
    const metaEl = document.getElementById("meta");
    if (!points.length) {
      metaEl.textContent = "";
      errEl.textContent = "Nincs elérhető adat.";
      return;
    }

    // present-moment boundary: last x where any actual column is non-null
    let boundaryX = null;
    for (const p of points) {
      if (ACTUAL_KEYS.some((k) => p[k] != null)) boundaryX = Date.parse(p.t);
    }

    const stored = loadVisibility();
    const datasets = KEYS.map((k) => ({
      label: LABELS[k],
      data: points.map((p) => ({ x: Date.parse(p.t), y: p[k] })),
      borderColor: COLORS[k],
      backgroundColor: COLORS[k],
      borderWidth: DEFAULT_ON.has(k) ? 2 : 1.5,
      pointRadius: 0,
      pointHoverRadius: 4,
      spanGaps: false,
      tension: 0.15,
      hidden: !isOn(stored, k),
    }));

    Chart.defaults.color = "#c7ccd4";
    Chart.defaults.font.family = "system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif";

    new Chart(document.getElementById("chart"), {
      type: "line",
      data: { datasets },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        animation: false,
        normalized: true,
        interaction: { mode: "index", intersect: false },
        scales: {
          x: {
            type: "time",
            adapters: { date: { zone: TZ } },
            time: { unit: "hour", displayFormats: { hour: "HH:mm" }, tooltipFormat: "yyyy.MM.dd HH:mm" },
            ticks: { color: "#9aa0aa", maxRotation: 0, autoSkip: true, autoSkipPadding: 24 },
            grid: { color: "#ffffff12" },
          },
          y: {
            title: { display: true, text: "Terhelés / termelés (MW)", color: "#9aa0aa" },
            ticks: { color: "#9aa0aa" },
            grid: { color: "#ffffff12" },
          },
        },
        plugins: {
          legend: {
            position: "bottom",
            labels: { color: "#e6e6e6", boxWidth: 14, boxHeight: 3, usePointStyle: false },
            onClick: (e, item, legend) => {
              const ci = legend.chart;
              ci.setDatasetVisibility(item.datasetIndex, !ci.isDatasetVisible(item.datasetIndex));
              ci.update();
              saveVisibility(ci);
            },
          },
          tooltip: {
            mode: "index",
            intersect: false,
            position: "nearest",
            itemSort: (a, b) => b.parsed.y - a.parsed.y,
            filter: (item) => item.parsed.y != null,
            callbacks: {
              label: (item) => `${item.dataset.label}: ${Math.round(item.parsed.y)} MW`,
            },
          },
        },
      },
      plugins: [nowLinePlugin(() => boundaryX)],
    });

    metaEl.textContent =
      `Időszak: ±12 óra · ${points.length} adatpont · ` +
      `piros vonal = „Most” (tény adatok határa)`;
  })();
  </script>
</body>
</html>
